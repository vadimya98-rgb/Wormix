<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Мини-игра — Wormix Guide</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin:0; padding:0; background:#0a0a1a; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:system-ui, sans-serif; user-select:none; overflow:hidden; }
    .game-wrapper { position:relative; width:100%; max-width:400px; aspect-ratio:9/16; background:#1a1a2e; border-radius:24px; overflow:hidden; box-shadow:0 0 60px rgba(79,70,229,0.3); }
    canvas { display:block; width:100%; height:100%; background:#2d1b3d; cursor:pointer; touch-action:none; }
    .back-btn { position:absolute; top:12px; left:12px; z-index:10; background:rgba(0,0,0,0.6); color:#fff; border:none; border-radius:30px; padding:6px 16px; font-size:0.8rem; cursor:pointer; backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,0.15); text-decoration:none; }
  </style>
</head>
<body>
<div class="game-wrapper">
  <a href="index.html" class="back-btn">🏠 Главная</a>
  <canvas id="gameCanvas"></canvas>
</div>
<script>
  // ============================================================
  // 1. НАСТРОЙКИ И КАНВАС
  // ============================================================
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    W = canvas.width;
    H = canvas.height;
    ctx.scale(1, 1); // сброс трансформаций
  }
  window.addEventListener('resize', resize);
  resize();

  // ============================================================
  // 2. ЗАГРУЗКА ИЗОБРАЖЕНИЙ (с crossOrigin)
  // ============================================================
  function loadImage(src) {
    return new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = () => {
        console.warn('Не удалось загрузить:', src);
        resolve(null);
      };
      img.src = src;
    });
  }

  const imageUrls = {
    cat: 'https://iili.io/nHuMt8x.jpg',
    dragon: 'https://iili.io/nHuMPn9.jpg',
    demon: 'https://iili.io/nHuMs6u.jpg',
    robot: 'https://iili.io/nHuM4Z7.jpg',
    dog: 'https://iili.io/nHuMrjS.jpg',
    zombie: 'https://iili.io/nHuMZaj.jpg',
    hare: 'https://iili.io/nHuMQ3b.jpg',
  };

  let images = {};

  async function loadAllImages() {
    const keys = Object.keys(imageUrls);
    for (let k of keys) {
      images[k] = await loadImage(imageUrls[k]);
    }
  }

  // ============================================================
  // 3. ИГРОВАЯ ЛОГИКА
  // ============================================================
  const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
  let state = STATE.MENU;

  let player = { x: 0, y: 0, radius: 24, side: 0 };
  let coins = [];
  let coinCount = 0;
  let enemies = [];
  let bullets = [];
  let distance = 0;
  let gameTime = 0;
  let difficulty = 1;
  let enemySpawnTimer = 0;
  let enemySpawnInterval = 120;
  let maxEnemies = 3;
  let touchLeft = false, touchRight = false;

  function resetGame() {
    player.x = W / 2;
    player.y = H * 0.7;
    player.radius = 24;
    coins = [];
    coinCount = 0;
    enemies = [];
    bullets = [];
    distance = 0;
    gameTime = 0;
    difficulty = 1;
    enemySpawnTimer = 0;
    enemySpawnInterval = 120;
    maxEnemies = 3;
    touchLeft = false;
    touchRight = false;
  }

  function spawnEnemy() {
    const types = ['dragon', 'demon', 'robot', 'dog', 'zombie', 'hare'];
    const type = types[Math.floor(Math.random() * types.length)];
    const side = Math.random() > 0.5 ? -1 : 1;
    const x = side === -1 ? 40 : W - 40;
    const y = 60 + Math.random() * (H * 0.6);
    enemies.push({
      type: type,
      x: x,
      y: y,
      side: side,
      shootTimer: 0,
      shootInterval: 60 + Math.random() * 40,
    });
  }

  function enemyShoot(enemy) {
    const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
    const speed = 3 + difficulty * 0.5;
    bullets.push({
      x: enemy.x,
      y: enemy.y,
      dx: Math.cos(angle) * speed,
      dy: Math.sin(angle) * speed,
      radius: 8,
      friendly: false,
    });
  }

  function spawnCoin() {
    const x = 60 + Math.random() * (W - 120);
    const y = 40 + Math.random() * (H - 200);
    coins.push({ x, y, radius: 14, collected: false });
  }

  function update() {
    if (state !== STATE.PLAYING) return;

    gameTime++;
    distance += 0.2;
    difficulty = 1 + Math.floor(gameTime / 600) * 0.5;
    enemySpawnInterval = Math.max(40, 120 - difficulty * 8);
    maxEnemies = Math.min(8, 3 + Math.floor(difficulty / 2));

    // Управление
    if (touchLeft) player.x -= 4;
    if (touchRight) player.x += 4;
    const margin = 50;
    if (player.x < margin) player.x = margin;
    if (player.x > W - margin) player.x = W - margin;

    // Спавн врагов
    enemySpawnTimer++;
    if (enemySpawnTimer >= enemySpawnInterval && enemies.length < maxEnemies) {
      spawnEnemy();
      enemySpawnTimer = 0;
    }

    // Враги стреляют
    enemies.forEach(enemy => {
      enemy.shootTimer++;
      if (enemy.shootTimer >= enemy.shootInterval) {
        enemyShoot(enemy);
        enemy.shootTimer = 0;
        enemy.shootInterval = 50 + Math.random() * 60;
      }
    });

    // Движение снарядов
    bullets.forEach(b => {
      b.x += b.dx;
      b.y += b.dy;
    });
    bullets = bullets.filter(b => b.x > 0 && b.x < W && b.y > 0 && b.y < H);

    // Попадания в игрока
    for (let b of bullets) {
      if (b.friendly) continue;
      const dx = b.x - player.x;
      const dy = b.y - player.y;
      if (Math.sqrt(dx*dx + dy*dy) < player.radius + b.radius) {
        state = STATE.GAMEOVER;
        return;
      }
    }

    // Сбор монет
    coins.forEach(c => {
      if (c.collected) return;
      const dx = c.x - player.x;
      const dy = c.y - player.y;
      if (Math.sqrt(dx*dx + dy*dy) < player.radius + c.radius) {
        c.collected = true;
        coinCount++;
      }
    });
    coins = coins.filter(c => !c.collected);

    if (gameTime % 90 === 0 && coins.length < 10) spawnCoin();
  }

  // ============================================================
  // 4. ОТРИСОВКА
  // ============================================================
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Фон
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a0a2e');
    grad.addColorStop(1, '#0d1b2a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Бревно
    const logW = 32, logX = W/2 - logW/2;
    ctx.fillStyle = '#5c3a1e';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 15;
    ctx.fillRect(logX, 0, logW, H);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#3d2614';
    ctx.lineWidth = 2;
    for (let y = 0; y < H; y += 30) {
      ctx.beginPath();
      ctx.moveTo(logX + 4, y);
      ctx.lineTo(logX + logW - 4, y + 12);
      ctx.stroke();
    }

    // Монеты
    coins.forEach(c => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.radius, 0, Math.PI*2);
      ctx.fillStyle = '#fcd34d';
      ctx.shadowColor = '#fcd34d';
      ctx.shadowBlur = 20;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#000';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('₣', c.x, c.y+1);
    });

    // Враги (если картинка не загружена — круг)
    enemies.forEach(enemy => {
      const img = images[enemy.type];
      if (img) {
        const size = 50;
        ctx.drawImage(img, enemy.x - size/2, enemy.y - size/2, size, size);
      } else {
        ctx.fillStyle = '#f00';
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, 20, 0, Math.PI*2);
        ctx.fill();
      }
    });

    // Снаряды
    bullets.forEach(b => {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
      ctx.fillStyle = b.friendly ? '#4ade80' : '#f87171';
      ctx.shadowColor = '#f87171';
      ctx.shadowBlur = 25;
      ctx.fill();
      ctx.shadowBlur = 0;
    });

    // Игрок (кот)
    const catImg = images.cat;
    if (catImg) {
      const size = 56;
      ctx.drawImage(catImg, player.x - size/2, player.y - size/2, size, size);
    } else {
      ctx.fillStyle = '#ff0';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
      ctx.fill();
    }

    // Счетчики
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 8;
    ctx.fillText('🪙 ' + coinCount, 16, 16);
    ctx.textAlign = 'right';
    ctx.fillText('📏 ' + Math.floor(distance) + 'м', W - 16, 16);
    ctx.shadowBlur = 0;

    // Меню
    if (state === STATE.MENU) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🎮 Мини-игра', W/2, H/2 - 70);
      ctx.font = '20px sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('Уклоняйся от снарядов и собирай монеты', W/2, H/2 - 20);
      ctx.fillStyle = '#818cf8';
      ctx.font = 'bold 28px sans-serif';
      ctx.fillText('▶ Начать', W/2, H/2 + 50);
    }

    if (state === STATE.GAMEOVER) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#f87171';
      ctx.font = 'bold 42px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('💀 КОНЕЦ', W/2, H/2 - 70);
      ctx.fillStyle = '#fff';
      ctx.font = '22px sans-serif';
      ctx.fillText('🪙 ' + coinCount + ' монет', W/2, H/2);
      ctx.fillText('📏 ' + Math.floor(distance) + ' метров', W/2, H/2 + 40);
      ctx.fillStyle = '#818cf8';
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText('🔄 Начать заново', W/2, H/2 + 100);
    }
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  // ============================================================
  // 5. УПРАВЛЕНИЕ
  // ============================================================
  function handleTap(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const x = (clientX - rect.left) * scaleX;
    const y = (clientY - rect.top) * scaleY;

    if (state === STATE.MENU) {
      if (x > W/2 - 100 && x < W/2 + 100 && y > H/2 + 20 && y < H/2 + 80) {
        state = STATE.PLAYING;
        resetGame();
      }
      return;
    }

    if (state === STATE.GAMEOVER) {
      if (x > W/2 - 120 && x < W/2 + 120 && y > H/2 + 70 && y < H/2 + 130) {
        state = STATE.PLAYING;
        resetGame();
      }
      return;
    }

    if (state === STATE.PLAYING) {
      if (x < W/2) { touchLeft = true; touchRight = false; }
      else { touchRight = true; touchLeft = false; }
    }
  }

  function handleRelease(e) {
    e.preventDefault();
    touchLeft = false;
    touchRight = false;
  }

  canvas.addEventListener('mousedown', handleTap);
  canvas.addEventListener('mouseup', handleRelease);
  canvas.addEventListener('mouseleave', handleRelease);
  canvas.addEventListener('touchstart', handleTap, {passive: false});
  canvas.addEventListener('touchend', handleRelease, {passive: false});
  canvas.addEventListener('touchcancel', handleRelease, {passive: false});

  // ============================================================
  // 6. ЗАПУСК
  // ============================================================
  async function init() {
    await loadAllImages();
    resetGame();
    state = STATE.MENU;
    gameLoop();
  }
  init();
</script>
</body>
</html>
