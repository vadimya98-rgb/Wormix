<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шапки — Wormix Guide</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Стили для списка шапок (одна в строке) */
    .hats-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }
    .hats-list .card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      transition: 0.3s;
      cursor: pointer;
    }
    .hats-list .card:hover {
      transform: translateY(-2px);
      border-color: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .hats-list .card .card-icon {
      flex-shrink: 0;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
      padding: 6px;
    }
    .hats-list .card .card-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .hats-list .card h3 {
      margin: 0;
      font-size: 1.1rem;
      color: #fff;
    }

    /* Модальное окно для просмотра изображения */
    .image-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 20px;
      box-sizing: border-box;
    }
    .image-modal.active {
      display: flex;
    }
    .image-modal img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }
    .image-modal .close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 2.5rem;
      color: #fff;
      cursor: pointer;
      background: none;
      border: none;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
      transition: 0.2s;
      z-index: 10000;
    }
    .image-modal .close-btn:hover {
      transform: scale(1.2);
    }

    /* Стили для рецептов сборки */
    .craft-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 20px;
    }
    .craft-item {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 18px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: 0.3s;
    }
    .craft-item:hover {
      border-color: #818cf8;
      background: rgba(255,255,255,0.08);
    }
    .craft-item .parts {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      color: #cbd5e1;
    }
    .craft-item .parts .part {
      background: rgba(255,255,255,0.06);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .craft-item .parts .plus {
      color: #94a3b8;
      font-weight: 700;
    }
    .craft-item .parts .equals {
      color: #fcd34d;
      font-weight: 700;
      font-size: 1.2rem;
    }
    .craft-item .result {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 120px;
      padding-left: 12px;
      border-left: 1px solid rgba(255,255,255,0.1);
    }
    .craft-item .result .result-name {
      font-weight: 700;
      color: #fff;
      font-size: 1.05rem;
    }
    .craft-item .result .result-cost {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .lottery-note {
      width: 100%;
      text-align: center;
      font-size: 0.8rem;
      color: #fcd34d;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.05);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <a href="index.html" class="back-btn">🏠 Главная</a>
    </div>

    <h1>🧢 Шапки</h1>
    <p class="subtitle">Все шапки в Wormix Mobile</p>

    <!-- КНОПКИ-ВКЛАДКИ -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="base">📦 База</button>
      <button class="tab-btn" data-tab="craft">🔧 Сборка</button>
    </div>

    <!-- ===== ВКЛАДКА "БАЗА" (все шапки списком) ===== -->
    <div id="base-tab" class="tab-content active">
      <div id="hats-list" class="hats-list"></div>
    </div>

    <!-- ===== ВКЛАДКА "СБОРКА" (рецепты) ===== -->
    <div id="craft-tab" class="tab-content">
      <p style="color: #94a3b8; text-align: center; margin-bottom: 12px;">
        🔧 Рецепты сборки шапок (скоро добавятся)
      </p>
      <div class="craft-grid">
        <!-- Пример рецепта (можно удалить или заменить) -->
        <div class="craft-item">
          <div class="parts">
            <span class="part">Колода карт</span>
            <span class="plus">+</span>
            <span class="part">Цилиндр</span>
            <span class="plus">+</span>
            <span class="part">Палочка</span>
            <span class="equals">=</span>
          </div>
          <div class="result">
            <span class="result-name">🎩 Шляпа фокусника</span>
            <span class="result-cost">💰 3000 фузов</span>
          </div>
          <div class="lottery-note">Выбить легу почти как выиграть в лотерею, шансы никому не известны</div>
        </div>
        <!-- Добавь свои рецепты сюда -->
      </div>
    </div>

  </div>

  <!-- Модальное окно для просмотра изображения -->
  <div id="imageModal" class="image-modal" onclick="closeModal()">
    <button class="close-btn" onclick="closeModal()">&times;</button>
    <img id="modalImage" src="" alt="Увеличенное изображение">
  </div>

  <script src="data.js"></script>
  <script>
    // Функция отображения шапок (для вкладки "База")
    function renderHats() {
      const container = document.getElementById('hats-list');
      if (!container) return;
      container.innerHTML = '';
      if (typeof hats === 'undefined' || hats.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8; text-align:center;">🧢 Скоро здесь появятся шапки</p>';
        return;
      }
      hats.forEach(h => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-icon"><img src="${h.image}" alt="${h.name}" loading="lazy"></div>
          <h3>${h.name}</h3>
        `;
        // Открываем модальное окно при клике на карточку
        card.addEventListener('click', function(e) {
          e.stopPropagation();
          openModal(h.image);
        });
        container.appendChild(card);
      });
    }

    // Функция открытия модального окна
    function openModal(imageSrc) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImage');
      modalImg.src = imageSrc;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden'; // запрещаем скролл
    }

    // Функция закрытия модального окна
    function closeModal() {
      const modal = document.getElementById('imageModal');
      modal.classList.remove('active');
      document.body.style.overflow = ''; // восстанавливаем скролл
    }

    // Закрытие по клавише Escape
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });

    // Переключение вкладок
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        const tabId = this.dataset.tab + '-tab';
        document.getElementById(tabId).classList.add('active');
      });
    });

    // Запуск
    document.addEventListener('DOMContentLoaded', function() {
      if (document.getElementById('hats-list')) renderHats();
    });
  </script>
</body>
</html>
