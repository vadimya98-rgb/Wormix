<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шапки — Wormix Guide</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Стили для рецептов сборки (как в арсенале) */
    .craft-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 20px;
    }
    .craft-item {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 18px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: 0.3s;
    }
    .craft-item:hover {
      border-color: #818cf8;
      background: rgba(255,255,255,0.08);
    }
    .craft-item .parts {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      color: #cbd5e1;
    }
    .craft-item .parts .part {
      background: rgba(255,255,255,0.06);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .craft-item .parts .plus {
      color: #94a3b8;
      font-weight: 700;
    }
    .craft-item .parts .equals {
      color: #fcd34d;
      font-weight: 700;
      font-size: 1.2rem;
    }
    .craft-item .result {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 120px;
      padding-left: 12px;
      border-left: 1px solid rgba(255,255,255,0.1);
    }
    .craft-item .result .result-name {
      font-weight: 700;
      color: #fff;
      font-size: 1.05rem;
    }
    .craft-item .result .result-cost {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .lottery-note {
      width: 100%;
      text-align: center;
      font-size: 0.8rem;
      color: #fcd34d;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.05);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <a href="index.html" class="back-btn">🏠 Главная</a>
    </div>

    <h1>🧢 Шапки</h1>
    <p class="subtitle">Все шапки в Wormix Mobile</p>

    <!-- КНОПКИ-ВКЛАДКИ -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="base">📦 База</button>
      <button class="tab-btn" data-tab="craft">🔧 Сборка</button>
    </div>

    <!-- ===== ВКЛАДКА "БАЗА" (все шапки) ===== -->
    <div id="base-tab" class="tab-content active">
      <div id="hats-list" class="card-grid"></div>
    </div>

    <!-- ===== ВКЛАДКА "СБОРКА" (рецепты) ===== -->
    <div id="craft-tab" class="tab-content">
      <p style="color: #94a3b8; text-align: center; margin-bottom: 12px;">
        🔧 Рецепты сборки шапок (скоро добавятся)
      </p>
      <div class="craft-grid">
        <!-- Пример рецепта (можно удалить или заменить) -->
        <div class="craft-item">
          <div class="parts">
            <span class="part">Колода карт</span>
            <span class="plus">+</span>
            <span class="part">Цилиндр</span>
            <span class="plus">+</span>
            <span class="part">Палочка</span>
            <span class="equals">=</span>
          </div>
          <div class="result">
            <span class="result-name">🎩 Шляпа фокусника</span>
            <span class="result-cost">💰 3000 фузов</span>
          </div>
          <div class="lottery-note">Выбить легу почти как выиграть в лотерею, шансы никому не известны</div>
        </div>
        <!-- Добавь свои рецепты сюда -->
      </div>
    </div>

  </div>

  <script src="data.js"></script>
  <script>
    // Функция отображения шапок (для вкладки "База")
    function renderHats() {
      const container = document.getElementById('hats-list');
      if (!container) return;
      container.innerHTML = '';
      if (typeof hats === 'undefined' || hats.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8; text-align:center;">🧢 Скоро здесь появятся шапки</p>';
        return;
      }
      hats.forEach(h => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-icon"><img src="${h.image}" alt="${h.name}" loading="lazy"></div>
          <h3>${h.name}</h3>
        `;
        container.appendChild(card);
      });
    }

    // Переключение вкладок
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        const tabId = this.dataset.tab + '-tab';
        document.getElementById(tabId).classList.add('active');
      });
    });

    // Запуск
    document.addEventListener('DOMContentLoaded', function() {
      if (document.getElementById('hats-list')) renderHats();
    });
  </script>
</body>
</html>
