<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шапки — Wormix Information</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .hats-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }
    .hats-list .card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      transition: 0.3s;
      cursor: pointer;
    }
    .hats-list .card:hover {
      transform: translateY(-2px);
      border-color: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .hats-list .card .card-icon {
      flex-shrink: 0;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
      padding: 6px;
    }
    .hats-list .card .card-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .hats-list .card h3 {
      margin: 0;
      font-size: 1.1rem;
      color: #fff;
    }

    .boss-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 20px;
    }
    .boss-grid .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      transition: 0.3s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .boss-grid .card:hover {
      transform: translateY(-4px);
      border-color: #fcd34d;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .boss-grid .card .card-icon {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
      padding: 8px;
    }
    .boss-grid .card .card-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .boss-grid .card h3 {
      font-size: 0.9rem;
      color: #fff;
      margin: 0;
      text-align: center;
      line-height: 1.2;
    }

    .craft-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 20px;
    }
    .craft-item {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 16px 18px;
      transition: 0.3s;
    }
    .craft-item:hover {
      border-color: #818cf8;
      background: rgba(255,255,255,0.08);
    }
    .craft-item .craft-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .craft-item .craft-ingredient {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.05);
      padding: 4px 12px 4px 6px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      transition: 0.2s;
    }
    .craft-item .craft-ingredient:hover {
      background: rgba(255,255,255,0.12);
      border-color: #818cf8;
    }
    .craft-item .craft-ingredient img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 6px;
      background: rgba(0,0,0,0.2);
      padding: 2px;
      pointer-events: none;
    }
    .craft-item .craft-ingredient .name {
      font-size: 0.85rem;
      color: #cbd5e1;
      white-space: nowrap;
      pointer-events: none;
    }
    .craft-item .craft-result {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(252, 211, 77, 0.08);
      padding: 4px 14px 4px 6px;
      border-radius: 30px;
      border: 1px solid rgba(252, 211, 77, 0.2);
      cursor: pointer;
      transition: 0.2s;
    }
    .craft-item .craft-result:hover {
      background: rgba(252, 211, 77, 0.15);
    }
    .craft-item .craft-result img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 6px;
      background: rgba(0,0,0,0.2);
      padding: 2px;
      pointer-events: none;
    }
    .craft-item .craft-result .name {
      font-size: 0.9rem;
      color: #fff;
      font-weight: 600;
      white-space: nowrap;
      pointer-events: none;
    }
    .craft-item .craft-plus {
      color: #94a3b8;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .craft-item .craft-equals {
      color: #fcd34d;
      font-weight: 700;
      font-size: 1.3rem;
    }
    .craft-item .craft-cost {
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.04);
      padding-top: 8px;
    }

    .image-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 20px;
      box-sizing: border-box;
    }
    .image-modal.active {
      display: flex;
    }
    .image-modal img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }
    .image-modal .close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 2.5rem;
      color: #fff;
      cursor: pointer;
      background: none;
      border: none;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
      transition: 0.2s;
      z-index: 10000;
    }
    .image-modal .close-btn:hover {
      transform: scale(1.2);
    }
  </style>
</head>
<body>
  <div id="bg-layer"></div>

  <div class="container">
    <div class="top-nav">
      <a href="index.html" class="back-btn">🏠 Главная</a>
    </div>

    <h1>🧢 Шапки</h1>
    <p class="subtitle">Все шапки в Wormix Mobile</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="base">📦 База</button>
      <button class="tab-btn" data-tab="boss">👹 За Босса</button>
      <button class="tab-btn" data-tab="unique">⭐ Уникальные</button>
      <button class="tab-btn" data-tab="craft">🔧 Сборка</button>
    </div>

    <!-- БАЗА -->
    <div id="base-tab" class="tab-content active">
      <p style="color:#cbd5e1; text-align:center; font-style:italic; font-size:0.95rem; background:rgba(255,255,255,0.05); padding:8px 12px; border-radius:40px; margin-top:8px; border:1px solid rgba(255,255,255,0.05); backdrop-filter:blur(4px);">
        👆 Нажми на иконку — она увеличится
      </p>
      <div id="hats-list" class="hats-list"></div>
    </div>

    <!-- ЗА БОССА -->
    <div id="boss-tab" class="tab-content">
      <p style="color: #fcd34d; text-align: center; margin-bottom: 12px;">
        👹 Шапки, которые можно получить за прохождение боссов
      </p>
      <div id="boss-hats-list" class="boss-grid"></div>
    </div>

    <!-- УНИКАЛЬНЫЕ (2 в ряд) -->
    <div id="unique-tab" class="tab-content">
      <p style="color: #fcd34d; text-align: center; margin-bottom: 12px;">
        ⭐ Уникальные шапки – особые награды
      </p>
      <div id="unique-hats-list" class="boss-grid"></div>
    </div>

    <!-- СБОРКА -->
    <div id="craft-tab" class="tab-content">
      <p style="color: #fcd34d; text-align: center; margin-bottom: 12px;">
        🔧 Рецепты сборки шапок
      </p>
      <p style="color:#cbd5e1; text-align:center; font-style:italic; font-size:0.95rem; background:rgba(255,255,255,0.05); padding:8px 12px; border-radius:40px; margin-top:8px; border:1px solid rgba(255,255,255,0.05); backdrop-filter:blur(4px);">
        👆 Нажми на иконку — она увеличится
      </p>
      <div id="craft-list" class="craft-grid"></div>
    </div>

  </div>

  <div id="imageModal" class="image-modal" onclick="closeModal()">
    <button class="close-btn" onclick="closeModal()">&times;</button>
    <img id="modalImage" src="" alt="Увеличенное изображение">
  </div>

  <script src="hats-data.js"></script>
  <script>
    // ===== ПОИСК ПРЕДМЕТА =====
    function findItem(type, name) {
      const nameLower = name.toLowerCase().trim();
      let list = [];
      if (type === 'hat') list = hats;
      else if (type === 'bossHat') list = bossHats;
      else if (type === 'uniqueHat') list = uniqueHats;
      else if (type === 'artifact') list = artifacts;
      else if (type === 'bossArtifact') list = bossArtifacts;
      else return null;
      return list.find(item => item.name.toLowerCase().trim() === nameLower) || null;
    }

    // ===== РЕНДЕР БАЗЫ (id 1–61) =====
    function renderHats() {
      const container = document.getElementById('hats-list');
      if (!container) return;
      container.innerHTML = '';
      if (typeof hats === 'undefined' || hats.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8; text-align:center;">🧢 Скоро здесь появятся шапки</p>';
        return;
      }
      const baseHats = hats.filter(h => h.id >= 1 && h.id <= 61);
      if (baseHats.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8; text-align:center;">🧢 База шапок пуста</p>';
        return;
      }
      baseHats.forEach(h => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-icon"><img src="${h.image}" alt="${h.name}" loading="lazy"></div>
          <h3>${h.name}</h3>
        `;
        card.addEventListener('click', () => openModal(h.image));
        container.appendChild(card);
      });
    }

    // ===== РЕНДЕР БОССОВ =====
    function renderBossHats() {
      const container = document.getElementById('boss-hats-list');
      if (!container) return;
      container.innerHTML = '';
      if (typeof bossHats === 'undefined' || bossHats.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8; text-align:center; grid-column: 1 / -1;">🏆 Скоро здесь появятся шапки за боссов</p>';
        return;
      }
      bossHats.forEach(h => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-icon"><img src="${h.image}" alt="${h.name}" loading="lazy"></div>
          <h3>${h.name}</h3>
        `;
        card.addEventListener('click', () => openModal(h.image));
        container.appendChild(card);
      });
    }

    // ===== РЕНДЕР УНИКАЛЬНЫХ (используем boss-grid) =====
    function renderUniqueHats() {
      const container = document.getElementById('unique-hats-list');
      if (!container) return;
      container.innerHTML = '';
      if (typeof uniqueHats === 'undefined' || uniqueHats.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8; text-align:center; grid-column: 1 / -1;">⭐ Скоро здесь появятся уникальные шапки</p>';
        return;
      }
      uniqueHats.forEach(h => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-icon"><img src="${h.image}" alt="${h.name}" loading="lazy"></div>
          <h3>${h.name}</h3>
        `;
        card.addEventListener('click', () => openModal(h.image));
        container.appendChild(card);
      });
    }

    // ===== РЕНДЕР РЕЦЕПТОВ =====
    function renderCraftRecipes() {
      const container = document.getElementById('craft-list');
      if (!container) return;
      container.innerHTML = '';
      if (typeof hatCraftRecipes === 'undefined' || hatCraftRecipes.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8; text-align:center;">🔧 Рецепты сборки скоро появятся</p>';
        return;
      }
      hatCraftRecipes.forEach(recipe => {
        const item = document.createElement('div');
        item.className = 'craft-item';

        let ingredientsHTML = '';
        const ingNames = recipe.ingredients || [];
        ingNames.forEach((ing, index) => {
          if (ing.type === 'emblem') {
            const emblemImg = wormixEmblem?.image || '';
            const count = ing.count || 1;
            ingredientsHTML += `
              <span class="craft-ingredient" data-image="${emblemImg}">
                <img src="${emblemImg}" alt="Эмблема">
                <span class="name">${count}× Эмблема</span>
              </span>
            `;
          } else {
            const found = findItem(ing.type, ing.name);
            if (found) {
              ingredientsHTML += `
                <span class="craft-ingredient" data-image="${found.image}">
                  <img src="${found.image}" alt="${found.name}">
                  <span class="name">${found.name}</span>
                </span>
              `;
            } else {
              ingredientsHTML += `
                <span class="craft-ingredient">
                  <span class="name">❓ ${ing.name}</span>
                </span>
              `;
            }
          }
          if (index < ingNames.length - 1) {
            ingredientsHTML += `<span class="craft-plus">+</span>`;
          }
        });

        const resultName = recipe.result?.name || 'Неизвестно';
        const resultItem = findItem('hat', resultName) || findItem('bossHat', resultName) || findItem('uniqueHat', resultName);
        let resultHTML = '';
        if (resultItem) {
          resultHTML = `
            <span class="craft-result" data-image="${resultItem.image}">
              <img src="${resultItem.image}" alt="${resultItem.name}">
              <span class="name">${resultItem.name}</span>
            </span>
          `;
        } else {
          resultHTML = `
            <span class="craft-result">
              <span class="name">❓ ${resultName}</span>
            </span>
          `;
        }

        item.innerHTML = `
          <div class="craft-row">
            ${ingredientsHTML}
            <span class="craft-equals">=</span>
            ${resultHTML}
          </div>
          <div class="craft-cost">💰 Стоимость: ${recipe.cost || '—'}</div>
        `;
        container.appendChild(item);
      });

      container.querySelectorAll('.craft-ingredient[data-image], .craft-result[data-image]').forEach(el => {
        el.addEventListener('click', function(e) {
          e.stopPropagation();
          const imgSrc = this.dataset.image;
          if (imgSrc) openModal(imgSrc);
        });
      });
    }

    // ===== МОДАЛЬНОЕ ОКНО =====
    function openModal(imageSrc) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImage');
      modalImg.src = imageSrc;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      const modal = document.getElementById('imageModal');
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // ===== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК =====
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        document.getElementById(this.dataset.tab + '-tab').classList.add('active');
      });
    });

    // ===== ЗАПУСК =====
    document.addEventListener('DOMContentLoaded', function() {
      if (document.getElementById('hats-list')) renderHats();
      if (document.getElementById('boss-hats-list')) renderBossHats();
      if (document.getElementById('unique-hats-list')) renderUniqueHats();
      if (document.getElementById('craft-list')) renderCraftRecipes();
    });
  </script>
</body>
</html>
