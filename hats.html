<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шапки — Wormix Guide</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <a href="index.html" class="back-btn">🏠 Главная</a>
    </div>

    <h1>🧢 Шапки</h1>
    <p class="subtitle">Все шапки в Wormix Mobile</p>

    <!-- Сетка карточек -->
    <div id="hats-list" class="card-grid"></div>
  </div>

  <script src="data.js"></script>
  <script src="render.js"></script>
  <script>
    // Функция для отображения шапок (если её нет в render.js)
    function renderHats() {
      const container = document.getElementById('hats-list');
      if (!container) return;
      container.innerHTML = '';
      if (typeof hats === 'undefined' || hats.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8; text-align:center;">🧢 Скоро здесь появятся шапки</p>';
        return;
      }
      hats.forEach(h => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-icon"><img src="${h.image}" alt="${h.name}" loading="lazy"></div>
          <h3>${h.name}</h3>
        `;
        container.appendChild(card);
      });
    }

    // Запуск
    document.addEventListener('DOMContentLoaded', function() {
      if (document.getElementById('hats-list')) renderHats();
    });
  </script>
</body>
</html>
